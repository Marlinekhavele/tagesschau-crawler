[tool.poetry]
name = "tagesschau-crawler"
version = "0.1.0"
description = "A system to crawl and store Tagesschau articles with version history"
authors = ["Your Name <your.email@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
Flask-RESTful = "^0.3.9"
Flask-SQLAlchemy = "^3.0.3"
psycopg = "^3.1.12"
psycopg-binary = "^3.1.12"
marshmallow = "^3.19.0"
requests = "^2.28.2"
beautifulsoup4 = "^4.12.0"
apscheduler = "^3.10.1"
python-dotenv = "^1.0.0"
flask = "^3.1.0"
flask-migrate = "^4.1.0"
psycopg2 = "^2.9.10"
pytest = "^7.3.1"
pytest-cov = "^6.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.1"
black = "^23.3.0"
flake8 = "^6.0.0"

[tool.poetry.scripts]
start = "flask:run --host=0.0.0.0"
crawler = "crawler.crawler:TagesschauCrawler.crawl_overview_page"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"